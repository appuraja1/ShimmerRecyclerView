plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.appuraja.views.shimmer'
    compileSdk 37

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // JitPack / MavenPublish ke liye release AAR aur source code export setup
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

    lint {
        targetSdk 37
    }
    testOptions {
        targetSdk 37
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    api "io.supercharge:shimmerlayout:2.1.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.appuraja'
                artifactId = 'shimmer-recyclerview'
                version = '1.0.0'
            }
        }
    }
}